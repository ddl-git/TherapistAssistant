<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestionale Studio{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{{ url_for('main.index') }}">Gestionale Studio</a>
      {% if session.get('logged_in') %}
        <div class="d-flex gap-1 flex-wrap app-nav">
          <a class="app-nav-link {{ 'active' if request.endpoint == 'queue.list_queue' else '' }}" href="{{ url_for('queue.list_queue') }}">Coda</a>
          <a class="app-nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('anagrafiche.') else '' }}" href="{{ url_for('anagrafiche.index') }}">Anagrafiche</a>
          <a class="app-nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('movimenti.') else '' }}" href="{{ url_for('movimenti.list_movimenti') }}">Movimenti</a>
          <a class="app-nav-link {{ 'active' if request.endpoint == 'report.index' else '' }}" href="{{ url_for('report.index') }}">Report</a>
          <a class="app-nav-link {{ 'active' if request.endpoint == 'cashflow.index' else '' }}" href="{{ url_for('cashflow.index') }}">Flusso di cassa</a>
          <a class="app-nav-link" href="{{ url_for('auth.logout') }}">Esci</a>
        </div>
      {% endif %}
    </div>
  </nav>
  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
